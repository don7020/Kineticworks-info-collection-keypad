<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>정보 입력</title>
<style>
  /* ============================================
     디자인은 여기 CSS만 나중에 통째로 교체하면 됩니다.
     구조(HTML)는 그대로 두고 색/폰트/레이아웃만 바꿔도 동작합니다.
     ============================================ */
  :root {
    --color-bg: #f5f5f3;
    --color-surface: #ffffff;
    --color-text: #1a1a1a;
    --color-muted: #8a8a86;
    --color-accent: #1a1a1a;
    --color-border: #dddddb;
    --color-error: #c0392b;
    --radius: 12px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }

  .screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 480px;
    background: var(--color-surface);
    border-radius: var(--radius);
    padding: 32px 28px 28px;
    box-shadow: 0 2px 24px rgba(0,0,0,0.06);
  }

  .card h1 {
    font-size: 22px;
    margin: 0 0 6px;
  }

  .card .desc {
    font-size: 14px;
    color: var(--color-muted);
    margin: 0 0 28px;
    line-height: 1.5;
  }

  .field {
    margin-bottom: 22px;
  }

  .field label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .field label .optional {
    font-weight: 400;
    color: var(--color-muted);
    font-size: 12px;
    margin-left: 4px;
  }

  .field input[type="text"],
  .field input[type="tel"] {
    width: 100%;
    padding: 14px 14px;
    font-size: 16px;
    border: 1px solid var(--color-border);
    border-radius: 8px;
    background: #fafafa;
    color: var(--color-text);
  }

  .field input:focus {
    outline: none;
    border-color: var(--color-accent);
    background: #fff;
  }

  .choice-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .choice-group.gender { flex-wrap: nowrap; }

  .choice-btn {
    flex: 1;
    min-width: 64px;
    padding: 12px 8px;
    text-align: center;
    border: 1px solid var(--color-border);
    border-radius: 8px;
    background: #fafafa;
    font-size: 14px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }

  .choice-btn.selected {
    background: var(--color-accent);
    border-color: var(--color-accent);
    color: #fff;
  }

  .field .error-msg {
    display: none;
    color: var(--color-error);
    font-size: 12px;
    margin-top: 6px;
  }

  .field.invalid input {
    border-color: var(--color-error);
  }

  .field.invalid .error-msg {
    display: block;
  }

  .submit-btn {
    width: 100%;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: var(--color-accent);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 8px;
  }

  .submit-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .privacy-note {
    font-size: 11px;
    color: var(--color-muted);
    margin-top: 14px;
    line-height: 1.5;
    text-align: center;
  }

  /* 완료 화면 */
  .done-icon {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--color-accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin: 0 auto 20px;
  }

  .card.done { text-align: center; }

  .again-btn {
    margin-top: 20px;
    background: none;
    border: none;
    color: var(--color-muted);
    text-decoration: underline;
    font-size: 14px;
    cursor: pointer;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="screen">

  <!-- 입력 화면 -->
  <form class="card" id="formCard" novalidate>
    <h1>정보를 입력해주세요</h1>
    <p class="desc">아래 항목을 입력하고 제출 버튼을 눌러주세요.</p>

    <div class="field" id="field-name">
      <label for="name">이름</label>
      <input type="text" id="name" name="name" autocomplete="name" placeholder="홍길동">
      <div class="error-msg">이름을 입력해주세요.</div>
    </div>

    <div class="field" id="field-phone">
      <label for="phone">전화번호</label>
      <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="010-1234-5678" inputmode="numeric">
      <div class="error-msg">올바른 전화번호 형식으로 입력해주세요. (예: 010-1234-5678)</div>
    </div>

    <div class="field" id="field-gender">
      <label>성별</label>
      <div class="choice-group gender" data-field="gender">
        <div class="choice-btn" data-value="여성">여성</div>
        <div class="choice-btn" data-value="남성">남성</div>
        <div class="choice-btn" data-value="선택 안함">선택 안함</div>
      </div>
      <div class="error-msg">성별을 선택해주세요.</div>
    </div>

    <div class="field" id="field-age">
      <label>연령대</label>
      <div class="choice-group" data-field="ageGroup">
        <div class="choice-btn" data-value="10대">10대</div>
        <div class="choice-btn" data-value="20대">20대</div>
        <div class="choice-btn" data-value="30대">30대</div>
        <div class="choice-btn" data-value="40대">40대</div>
        <div class="choice-btn" data-value="50대+">50대+</div>
      </div>
      <div class="error-msg">연령대를 선택해주세요.</div>
    </div>

    <div class="field" id="field-instagram">
      <label for="instagram">인스타그램 아이디 <span class="optional">(선택)</span></label>
      <input type="text" id="instagram" name="instagram" autocomplete="off" placeholder="@theresoutdoor">
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">제출하기</button>

    <p class="privacy-note">
      입력하신 정보는 데얼스 이벤트 운영 목적으로만 사용되며,<br>
      목적 달성 후 안전하게 폐기됩니다.
    </p>
  </form>

  <!-- 완료 화면 -->
  <div class="card done hidden" id="doneCard">
    <div class="done-icon">✓</div>
    <h1>제출 완료</h1>
    <p class="desc">감사합니다. 정보가 정상적으로 접수되었습니다.</p>
    <button class="again-btn" id="againBtn">다음 분 입력하기</button>
  </div>

</div>

<script>
  // ============================================
  // 여기에 배포한 Apps Script 웹앱 URL을 붙여넣으세요.
  // (배포 방법은 README.md 참고)
  // ============================================
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzBbhF2mEiwOjG4Y51HcXTFjVdkqDXK9-MRlsrb-1nNiW5o0U6_1yBadeFMvPTUy3VQ/exec";

  const form = document.getElementById('formCard');
  const doneCard = document.getElementById('doneCard');
  const submitBtn = document.getElementById('submitBtn');

  const state = { gender: null, ageGroup: null };

  // 선택형 버튼 (성별 / 연령대) 클릭 처리
  document.querySelectorAll('.choice-group').forEach(group => {
    const fieldName = group.dataset.field;
    group.querySelectorAll('.choice-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        group.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        state[fieldName] = btn.dataset.value;
        clearError(group.closest('.field'));
      });
    });
  });

  function clearError(fieldEl) {
    fieldEl.classList.remove('invalid');
  }

  function setError(fieldEl) {
    fieldEl.classList.add('invalid');
  }

  function isValidPhone(value) {
    // 010-1234-5678 / 01012345678 / 010 1234 5678 등 허용
    const digits = value.replace(/[^0-9]/g, '');
    return /^01[016789]\d{7,8}$/.test(digits);
  }

  function formatPhone(value) {
    const digits = value.replace(/[^0-9]/g, '');
    if (digits.length === 11) return digits.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
    if (digits.length === 10) return digits.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3');
    return value;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    const nameEl = document.getElementById('name');
    const phoneEl = document.getElementById('phone');
    const instagramEl = document.getElementById('instagram');

    let valid = true;

    if (!nameEl.value.trim()) {
      setError(document.getElementById('field-name'));
      valid = false;
    } else {
      clearError(document.getElementById('field-name'));
    }

    if (!isValidPhone(phoneEl.value)) {
      setError(document.getElementById('field-phone'));
      valid = false;
    } else {
      clearError(document.getElementById('field-phone'));
    }

    if (!state.gender) {
      setError(document.getElementById('field-gender'));
      valid = false;
    } else {
      clearError(document.getElementById('field-gender'));
    }

    if (!state.ageGroup) {
      setError(document.getElementById('field-age'));
      valid = false;
    } else {
      clearError(document.getElementById('field-age'));
    }

    if (!valid) return;

    const payload = {
      name: nameEl.value.trim(),
      phone: formatPhone(phoneEl.value.trim()),
      gender: state.gender,
      ageGroup: state.ageGroup,
      instagram: instagramEl.value.trim()
    };

    submitBtn.disabled = true;
    submitBtn.textContent = '제출 중...';

    // Apps Script 웹앱으로 전송
    // mode: 'no-cors' 로 보내면 구글 쪽 CORS 제한 없이 전송 가능하지만
    // 응답 내용은 읽을 수 없습니다 (전송 성공 여부만 낙관적으로 처리).
    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
    .then(() => {
      showDone();
    })
    .catch(() => {
      // 네트워크 자체가 끊긴 경우가 아니면 보통 여기로 안 옵니다 (no-cors 특성상).
      alert('전송 중 문제가 발생했습니다. 다시 시도해주세요.');
      submitBtn.disabled = false;
      submitBtn.textContent = '제출하기';
    });
  });

  function showDone() {
    form.classList.add('hidden');
    doneCard.classList.remove('hidden');
  }

  document.getElementById('againBtn').addEventListener('click', () => {
    form.reset();
    state.gender = null;
    state.ageGroup = null;
    document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
    document.querySelectorAll('.field').forEach(f => f.classList.remove('invalid'));
    submitBtn.disabled = false;
    submitBtn.textContent = '제출하기';
    doneCard.classList.add('hidden');
    form.classList.remove('hidden');
  });
</script>

</body>
</html>
