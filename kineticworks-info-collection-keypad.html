<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Theres | 정보 입력</title>

<style>
  /* =========================================================
     디자인 커스터마이징 영역
     -- 나중에 색상/폰트/배경/로고 등을 바꿀 땐 이 :root 변수와
        아래 표시된 위치들만 건드리면 됩니다.
     ========================================================= */
  :root {
    --color-bg: #f4f2ee;
    --color-card: #ffffff;
    --color-text: #1a1a1a;
    --color-subtext: #767267;
    --color-accent: #2b2b2b;      /* 버튼/선택 강조색 */
    --color-accent-contrast: #ffffff;
    --color-border: #e2ded6;
    --color-error: #c0392b;
    --radius: 18px;
    --font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo",
                   "Noto Sans KR", "Malgun Gothic", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--color-bg);
    font-family: var(--font-family);
    color: var(--color-text);
    -webkit-tap-highlight-color: transparent;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .pad {
    width: 100%;
    max-width: 560px;
    background: var(--color-card);
    border-radius: var(--radius);
    box-shadow: 0 20px 60px rgba(0,0,0,0.08);
    padding: 40px 32px 32px;
    position: relative;
    overflow: hidden;
  }

  /* 로고/헤더 영역 — 나중에 이미지 로고로 교체 가능 */
  .brand {
    text-align: center;
    margin-bottom: 8px;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--color-text);
    user-select: none;
  }

  h1 {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    margin: 4px 0 6px;
  }

  .subtitle {
    text-align: center;
    font-size: 14px;
    color: var(--color-subtext);
    margin: 0 0 28px;
    line-height: 1.5;
  }

  .field {
    margin-bottom: 22px;
  }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--color-text);
  }

  .field label .optional {
    font-weight: 400;
    color: var(--color-subtext);
  }

  input[type="text"],
  input[type="tel"] {
    width: 100%;
    padding: 16px 16px;
    font-size: 17px;
    border: 1.5px solid var(--color-border);
    border-radius: 12px;
    background: #fff;
    color: var(--color-text);
    outline: none;
    transition: border-color 0.15s ease;
  }

  input[type="text"]:focus,
  input[type="tel"]:focus {
    border-color: var(--color-accent);
  }

  .btn-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .btn-choice {
    flex: 1 1 auto;
    min-width: 84px;
    min-height: 52px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1.5px solid var(--color-border);
    background: #fff;
    color: var(--color-text);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.12s ease;
    -webkit-user-select: none;
    user-select: none;
  }

  .btn-choice:active {
    transform: scale(0.97);
  }

  .btn-choice.selected {
    background: var(--color-accent);
    border-color: var(--color-accent);
    color: var(--color-accent-contrast);
    font-weight: 700;
  }

  .consent {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: #faf9f6;
    border: 1px solid var(--color-border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 24px;
  }

  .consent input[type="checkbox"] {
    width: 20px;
    height: 20px;
    margin-top: 2px;
    flex-shrink: 0;
    accent-color: var(--color-accent);
  }

  .consent-text {
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--color-subtext);
  }

  .consent-text strong {
    color: var(--color-text);
  }

  .error-msg {
    color: var(--color-error);
    font-size: 13px;
    text-align: center;
    min-height: 18px;
    margin-bottom: 8px;
  }

  .submit-btn {
    width: 100%;
    padding: 18px;
    font-size: 17px;
    font-weight: 700;
    border: none;
    border-radius: 14px;
    background: var(--color-accent);
    color: var(--color-accent-contrast);
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  .submit-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .submit-btn:active:not(:disabled) {
    transform: scale(0.99);
  }

  /* 완료 화면 */
  .thankyou {
    position: absolute;
    inset: 0;
    background: var(--color-card);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .thankyou.visible {
    opacity: 1;
    pointer-events: all;
  }

  .thankyou-check {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--color-accent);
    color: var(--color-accent-contrast);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    margin-bottom: 20px;
  }

  .thankyou h2 {
    font-size: 20px;
    margin: 0 0 8px;
  }

  .thankyou p {
    font-size: 14px;
    color: var(--color-subtext);
    margin: 0;
  }

  /* 하단 상태 표시 — 손님에게는 거의 눈에 안 띄는 작은 텍스트 */
  .footer-tag {
    text-align: center;
    font-size: 11px;
    color: var(--color-border);
    margin-top: 18px;
    letter-spacing: 0.05em;
    user-select: none;
  }

  /* 관리자 오버레이 (로고 5회 탭으로 열림) */
  .admin-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 24px;
  }

  .admin-overlay.visible { display: flex; }

  .admin-box {
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 380px;
  }

  .admin-box h3 { margin: 0 0 12px; font-size: 16px; }
  .admin-box p { font-size: 13px; color: var(--color-subtext); margin: 4px 0 16px; }
  .admin-box button {
    width: 100%;
    padding: 12px;
    margin-bottom: 8px;
    border-radius: 10px;
    border: 1px solid var(--color-border);
    background: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  .admin-box button.primary {
    background: var(--color-accent);
    color: var(--color-accent-contrast);
    border: none;
  }
</style>
</head>
<body>

<div class="pad">
  <div class="brand" id="brandTapTarget">THERES</div>
  <h1>정보를 남겨주세요</h1>
  <p class="subtitle">간단한 정보를 입력해주시면<br>다양한 소식과 혜택을 보내드릴게요.</p>

  <form id="leadForm" novalidate>
    <div class="field">
      <label for="name">이름</label>
      <input type="text" id="name" name="name" placeholder="홍길동" autocomplete="off">
    </div>

    <div class="field">
      <label for="phone">전화번호</label>
      <input type="tel" id="phone" name="phone" placeholder="010-1234-5678" inputmode="numeric" autocomplete="off">
    </div>

    <div class="field">
      <label>성별</label>
      <div class="btn-group" data-group="gender">
        <button type="button" class="btn-choice" data-value="남성">남성</button>
        <button type="button" class="btn-choice" data-value="여성">여성</button>
        <button type="button" class="btn-choice" data-value="선택안함">선택안함</button>
      </div>
    </div>

    <div class="field">
      <label>나이대</label>
      <div class="btn-group" data-group="ageGroup">
        <button type="button" class="btn-choice" data-value="10대">10대</button>
        <button type="button" class="btn-choice" data-value="20대">20대</button>
        <button type="button" class="btn-choice" data-value="30대">30대</button>
        <button type="button" class="btn-choice" data-value="40대">40대</button>
        <button type="button" class="btn-choice" data-value="50대 이상">50대 이상</button>
      </div>
    </div>

    <div class="field">
      <label for="instagram">인스타그램 아이디 <span class="optional">(선택)</span></label>
      <input type="text" id="instagram" name="instagram" placeholder="@theres_outdoor" autocomplete="off">
    </div>

    <div class="consent">
      <input type="checkbox" id="consent" name="consent">
      <label for="consent" class="consent-text">
        <strong>개인정보 수집·이용에 동의합니다.</strong><br>
        수집 항목: 이름, 전화번호, 성별, 나이대, 인스타그램 아이디(선택) ·
        수집 목적: 이벤트 응모 및 마케팅 정보 제공 ·
        보유 기간: 수집일로부터 1년 (요청 시 즉시 파기)
        <!-- TODO: 실제 이벤트/캠페인 목적에 맞게 문구를 수정하세요 -->
      </label>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <button type="submit" class="submit-btn" id="submitBtn">제출하기</button>
  </form>

  <div class="footer-tag" id="statusTag">Theres</div>

  <!-- 완료 화면 -->
  <div class="thankyou" id="thankyou">
    <div class="thankyou-check">✓</div>
    <h2>감사합니다!</h2>
    <p>소중한 정보를 남겨주셔서 감사해요.<br>곧 좋은 소식으로 찾아뵐게요.</p>
  </div>
</div>

<!-- 관리자 오버레이: 브랜드 텍스트를 짧은 시간 안에 5번 탭하면 열림 -->
<div class="admin-overlay" id="adminOverlay">
  <div class="admin-box">
    <h3>관리자 메뉴</h3>
    <p id="adminStatus">대기 중인 응답: 0건</p>
    <button class="primary" id="adminRetryBtn">지금 다시 전송 시도</button>
    <button id="adminDownloadBtn">대기 데이터 CSV로 내려받기</button>
    <button id="adminCloseBtn">닫기</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     설정 영역 — 배포 전 반드시 확인
     ========================================================= */
  var CONFIG = {
    // Apps Script 배포 후 나오는 웹 앱 URL로 교체하세요.
    WEB_APP_URL: 'https://script.google.com/a/macros/theres.co/s/AKfycbyXjQ3KPHkwm0hQX5ndDSpxwdQhoO6KErQqhIRovHGfu0VvewELUXzXE5jVHzosfcmO/exec',

    // 여러 행사/부스에서 같은 패드를 쓸 경우 구분용 라벨 (시트의 '수집소스' 컬럼에 기록됨)
    SOURCE_LABEL: '',

    // 제출 성공 후 감사 화면을 몇 ms 보여주고 폼을 초기화할지
    RESET_DELAY_MS: 4000,

    // 오프라인 대기열을 몇 ms 마다 재시도할지
    RETRY_INTERVAL_MS: 30000,

    QUEUE_KEY: 'theres_pad_queue_v1'
  };

  var form = document.getElementById('leadForm');
  var errorMsg = document.getElementById('errorMsg');
  var submitBtn = document.getElementById('submitBtn');
  var thankyou = document.getElementById('thankyou');
  var phoneInput = document.getElementById('phone');
  var nameInput = document.getElementById('name');
  var instagramInput = document.getElementById('instagram');
  var consentInput = document.getElementById('consent');

  var selections = { gender: null, ageGroup: null };

  /* ---- 버튼 그룹(성별/나이대) 단일 선택 처리 ---- */
  document.querySelectorAll('.btn-group').forEach(function (group) {
    var key = group.getAttribute('data-group');
    group.querySelectorAll('.btn-choice').forEach(function (btn) {
      btn.addEventListener('click', function () {
        group.querySelectorAll('.btn-choice').forEach(function (b) {
          b.classList.remove('selected');
        });
        btn.classList.add('selected');
        selections[key] = btn.getAttribute('data-value');
      });
    });
  });

  /* ---- 전화번호 자동 하이픈 ---- */
  phoneInput.addEventListener('input', function () {
    var digits = phoneInput.value.replace(/\D/g, '').slice(0, 11);
    var formatted = digits;
    if (digits.length > 3 && digits.length <= 7) {
      formatted = digits.slice(0, 3) + '-' + digits.slice(3);
    } else if (digits.length > 7) {
      formatted = digits.slice(0, 3) + '-' + digits.slice(3, 7) + '-' + digits.slice(7);
    }
    phoneInput.value = formatted;
  });

  function isValidPhone(value) {
    return /^01[0-9]-\d{3,4}-\d{4}$/.test(value);
  }

  function showError(message) {
    errorMsg.textContent = message;
  }

  function resetForm() {
    form.reset();
    selections.gender = null;
    selections.ageGroup = null;
    document.querySelectorAll('.btn-choice.selected').forEach(function (b) {
      b.classList.remove('selected');
    });
    showError('');
    submitBtn.disabled = false;
    submitBtn.textContent = '제출하기';
  }

  function hideThankyou() {
    thankyou.classList.remove('visible');
  }

  function showThankyou() {
    thankyou.classList.add('visible');
    setTimeout(function () {
      hideThankyou();
      resetForm();
    }, CONFIG.RESET_DELAY_MS);
  }

  /* ---- 오프라인 대기열 ---- */
  function getQueue() {
    try {
      return JSON.parse(localStorage.getItem(CONFIG.QUEUE_KEY) || '[]');
    } catch (e) {
      return [];
    }
  }

  function saveQueue(queue) {
    localStorage.setItem(CONFIG.QUEUE_KEY, JSON.stringify(queue));
  }

  function enqueue(payload) {
    var queue = getQueue();
    queue.push(payload);
    saveQueue(queue);
  }

  function sendPayload(payload) {
    if (!CONFIG.WEB_APP_URL || CONFIG.WEB_APP_URL.indexOf('REPLACE_WITH') === 0) {
      return Promise.reject(new Error('WEB_APP_URL이 설정되지 않았습니다.'));
    }
    return fetch(CONFIG.WEB_APP_URL, {
      method: 'POST',
      // text/plain 으로 보내야 브라우저가 프리플라이트(OPTIONS) 요청을 만들지 않음
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).then(function (res) {
      if (!res.ok) throw new Error('서버 응답 오류');
      return res.json();
    });
  }

  function flushQueue() {
    var queue = getQueue();
    if (queue.length === 0) return;

    var remaining = queue.slice();

    function tryNext() {
      if (remaining.length === 0) {
        saveQueue([]);
        updateAdminStatus();
        return;
      }
      var item = remaining[0];
      sendPayload(item).then(function () {
        remaining.shift();
        saveQueue(remaining);
        updateAdminStatus();
        tryNext();
      }).catch(function () {
        // 아직도 실패하면 여기서 멈추고 다음 재시도 주기를 기다림
        saveQueue(remaining);
        updateAdminStatus();
      });
    }

    tryNext();
  }

  /* ---- 폼 제출 ---- */
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    showError('');

    var name = nameInput.value.trim();
    var phone = phoneInput.value.trim();
    var instagram = instagramInput.value.trim();

    if (!name) return showError('이름을 입력해주세요.');
    if (!isValidPhone(phone)) return showError('전화번호 형식을 확인해주세요. (예: 010-1234-5678)');
    if (!selections.gender) return showError('성별을 선택해주세요.');
    if (!selections.ageGroup) return showError('나이대를 선택해주세요.');
    if (!consentInput.checked) return showError('개인정보 수집·이용에 동의해주세요.');

    var payload = {
      name: name,
      phone: phone,
      gender: selections.gender,
      ageGroup: selections.ageGroup,
      instagram: instagram,
      consent: true,
      source: CONFIG.SOURCE_LABEL
    };

    submitBtn.disabled = true;
    submitBtn.textContent = '전송 중...';

    sendPayload(payload)
      .then(function () {
        showThankyou();
      })
      .catch(function () {
        // 네트워크/설정 문제 시에도 손님 경험은 끊기지 않도록 대기열에 저장하고 완료 처리
        enqueue(payload);
        updateAdminStatus();
        showThankyou();
      });
  });

  /* ---- 온라인 복귀 시 / 주기적으로 대기열 재전송 ---- */
  window.addEventListener('online', flushQueue);
  setInterval(flushQueue, CONFIG.RETRY_INTERVAL_MS);
  window.addEventListener('load', flushQueue);

  /* ---- 관리자 오버레이 (브랜드 텍스트 5회 탭) ---- */
  var tapTarget = document.getElementById('brandTapTarget');
  var adminOverlay = document.getElementById('adminOverlay');
  var adminStatus = document.getElementById('adminStatus');
  var tapTimes = [];

  function updateAdminStatus() {
    adminStatus.textContent = '대기 중인 응답: ' + getQueue().length + '건';
  }

  tapTarget.addEventListener('click', function () {
    var now = Date.now ? Date.now() : new Date().getTime();
    tapTimes.push(now);
    tapTimes = tapTimes.filter(function (t) { return now - t < 3000; });
    if (tapTimes.length >= 5) {
      tapTimes = [];
      updateAdminStatus();
      adminOverlay.classList.add('visible');
    }
  });

  document.getElementById('adminCloseBtn').addEventListener('click', function () {
    adminOverlay.classList.remove('visible');
  });

  document.getElementById('adminRetryBtn').addEventListener('click', function () {
    flushQueue();
    updateAdminStatus();
  });

  document.getElementById('adminDownloadBtn').addEventListener('click', function () {
    var queue = getQueue();
    var header = ['name', 'phone', 'gender', 'ageGroup', 'instagram', 'consent', 'source'];
    var rows = [header.join(',')];
    queue.forEach(function (item) {
      rows.push(header.map(function (h) {
        var v = item[h] === undefined ? '' : String(item[h]);
        return '"' + v.replace(/"/g, '""') + '"';
      }).join(','));
    });
    var blob = new Blob([rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'theres_pending_' + (Date.now ? Date.now() : new Date().getTime()) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  updateAdminStatus();
})();
</script>

</body>
</html>
